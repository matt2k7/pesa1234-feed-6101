name: Build JIDU6101 firmware (pesa1234 MTK fork)
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'pesa1234/openwrt branch to build'
        required: true
        default: 'next-r4.9.2.rss.mtk'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils rsync swig unzip zlib1g-dev file wget llvm
          
      - name: Clone pesa1234/openwrt
        run: |
          git clone --depth 1 -branch "${{ github.event.inputs.source_branch }}" \
          https://github.com/pesa1234/openwrt.git
          
      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
      - name: Configure for JIDU6101 with Custom Packages
        working-directory: openwrt
        run: |
          cat >> .config << 'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_jiorouter_ax6000-jidu6101=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_librespeed-go=y
          EOF
          make defconfig
          
      - name: Download sources
        working-directory: openwrt
        run: make download -j$(nproc)
        
      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s
          
      - name: Locate sysupgrade image
        working-directory: openwrt
        run: |
          find bin/targets/mediatek/filogic -type f -name "*jiorouter_ax6000-jidu6101-squashfs-sysupgrade.bin*"
          
      - name: Upload sysupgrade artifact
        uses: actions/upload-artifact@v4
        with:
          name: jidu6101-sysupgrade
          path: openwrt/bin/targets/mediatek/filogic/*jiorouter_ax6000-jidu6101-squashfs-sysupgrade.bin
          retention-days: 14
