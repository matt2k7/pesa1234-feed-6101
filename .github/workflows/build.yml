name: Build JIDU6101 firmware (pesa1234 fork)

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'pesa1234/openwrt branch to build'
        required: true
        default: 'next-r4.9.2.rss.mtk'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Free up disk space on runner
        run: |
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache \
            /usr/local/.ghcup /opt/az /usr/lib/jvm /usr/local/share/powershell \
            /usr/share/swift /opt/microsoft
          sudo docker image prune -a -f || true
          sudo apt-get clean
          echo "After cleanup:"
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync swig unzip zlib1g-dev file wget llvm

      - name: Clone pesa1234/openwrt
        run: |
          git clone --depth 1 -b "${{ github.event.inputs.source_branch }}" \
            https://github.com/pesa1234/openwrt.git openwrt

      - name: Sanity-check device is present in this branch
        working-directory: openwrt
        run: |
          grep -q "jiorouter_ax6000-jidu6101" target/linux/mediatek/image/filogic.mk || \
            (echo "::error::jiorouter_ax6000-jidu6101 not found in filogic.mk on branch ${{ github.event.inputs.source_branch }}" && exit 1)
          test -f target/linux/mediatek/dts/mt7986a-jiorouter-ax6000-jidu6101.dts || \
            (echo "::error::device dts missing on this branch" && exit 1)

      - name: Cache dl (source downloads)
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ github.event.inputs.source_branch }}-${{ hashFiles('openwrt/feeds.conf.default') }}
          restore-keys: |
            openwrt-dl-${{ github.event.inputs.source_branch }}-

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for JIDU6101
        working-directory: openwrt
        run: |
          cat >> .config << 'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_jiorouter_ax6000-jidu6101=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_librespeed-go=y
          CONFIG_PACKAGE_vnstat2=y
          CONFIG_PACKAGE_luci-app-vnstat2=y
          CONFIG_PACKAGE_internet-detector=y
          CONFIG_PACKAGE_luci-app-internet-detector=y

          # Required: EDCCA patch on this branch only compiles against the
          # full hostapd build, not wpad-basic-*. See build log from
          # 2026-07 for the edcca_mode_str implicit-declaration failure.
          CONFIG_PACKAGE_wpad-openssl=y
          # CONFIG_PACKAGE_wpad-basic-mbedtls is not set
          # CONFIG_PACKAGE_wpad-basic-wolfssl is not set
          EOF
          make defconfig

      - name: Download sources
        working-directory: openwrt
        run: make download -j$(nproc)

      - name: Disk space before build
        run: df -h /

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Disk space and output check (always runs)
        if: always()
        working-directory: openwrt
        run: |
          df -h /
          echo "--- bin/ directory tree ---"
          find bin -maxdepth 4 -type d 2>/dev/null || echo "bin/ does not exist - build did not reach image packaging stage"

      - name: List build output (debug aid)
        working-directory: openwrt
        run: find bin/targets/mediatek/filogic -type f

      - name: Locate sysupgrade image
        working-directory: openwrt
        run: |
          IMG=$(find bin/targets/mediatek/filogic -type f -name "*jiorouter_ax6000-jidu6101-squashfs-sysupgrade.bin")
          if [ -z "$IMG" ]; then
            echo "::error::sysupgrade image not found - check the debug listing above"
            exit 1
          fi
          cp "$IMG" ../sysupgrade.bin

      - name: Upload sysupgrade artifact
        uses: actions/upload-artifact@v4
        with:
          name: jidu6101-sysupgrade
          path: sysupgrade.bin
          retention-days: 14
